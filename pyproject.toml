[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carcopilot"
version = "0.1.0"
description = "On-device car diagnostic assistant powered by Gemma 4."
requires-python = ">=3.11"
dependencies = [
    "obd>=0.7.1",
    "httpx>=0.27",
    "pydantic>=2.7",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/carcopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require a running Ollama instance",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
